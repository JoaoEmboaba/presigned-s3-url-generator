org: embosoft

service: presigned-url-generator

provider:
  name: aws
  runtime: nodejs20.x
  tracing:
    lambda: true

functions:
  generator:
    handler: handler.generator
    name: presigned-url-generator
    memorySize: 512
    events:
      - http:
          path: /generate-presigned-url
          method: POST
    environment:
      BUCKET_NAME: uploader-app-bucket